name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            tasks: ':lib:jvmTest :lib:compileAndroidMain :lib:compileKotlinLinuxX64 :lib:compileKotlinWasmJs :lib:compileKotlinJs'
          - runner: ubuntu-24.04-arm
            tasks: ':lib:jvmTest :lib:compileKotlinLinuxArm64'
          - runner: windows-2025
            tasks: ':lib:jvmTest :lib:compileKotlinMingwX64'
          - runner: macos-15
            tasks: ':lib:jvmTest :lib:compileKotlinMacosArm64 :lib:compileKotlinIosArm64 :lib:compileKotlinIosSimulatorArm64 :lib:compileKotlinIosX64'
          - runner: macos-15-intel
            tasks: ':lib:jvmTest :lib:compileKotlinMacosX64'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        if: matrix.runner == 'ubuntu-24.04'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK
        if: matrix.runner == 'ubuntu-24.04'
        shell: bash
        run: |
          sdk_platform="$(sed -n 's/^androidSdkPlatformVersion=//p' gradle.properties)"
          build_tools="$(sed -n 's/^androidBuildToolsVersion=//p' gradle.properties)"
          sdkmanager "platforms;android-$sdk_platform" "build-tools;$build_tools"
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Expose MinGW tools
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cygpath -w /ucrt64/bin >> "$GITHUB_PATH"
      - name: Linux audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpulse-dev pkg-config
      - name: Build and test
        env:
          KAUDIOOUTPUT_JVM_CC: ${{ runner.os == 'Windows' && 'gcc' || 'cc' }}
          KAUDIOOUTPUT_MINGW_X64_CC: gcc
          KAUDIOOUTPUT_MINGW_X64_AR: ar
        shell: bash
        run: ./gradlew --no-daemon --max-workers=2 ${{ matrix.tasks }}
